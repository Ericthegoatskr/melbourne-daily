<!doctype html>
<html lang="en-AU" data-theme="navy" data-page="home">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f5f9" />
    <meta
      name="description"
      content="Your Melbourne day, in one place. Weather, live UV, street parking, public transport links and regional air quality."
    />
    <script>
      // Apply the shared preference before styles paint either Pages app.
      (() => {
        let theme = "navy";
        try { if (localStorage.getItem("melbourne-collection:theme") === "light") theme = "light"; } catch {}
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === "navy" ? "#14213D" : "#f7f6fa";
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;450;500;550;600;650;700;750&amp;display=swap" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Melbourne Daily · Your city, at a glance</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
